# deployment.yaml
# Runs the weather classifier app in Kubernetes. The CD workflow replaces the
# image line below with the version it is deploying, so you can leave it as v1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  labels:
    app: weather-app
spec:
  replicas: 2                     # two copies, so one can be replaced while the other serves traffic
  revisionHistoryLimit: 5         # keep old versions so `kubectl rollout undo` can go back
  minReadySeconds: 5              # a new pod must stay ready for 5s before it counts as available
  selector:
    matchLabels:
      app: weather-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                 # start at most 1 extra pod during an update
      maxUnavailable: 0           # never take an old pod away before a new one is ready = no downtime
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
        - name: weather-app
          image: YOUR_DOCKERHUB_USERNAME/weather-app:v1   # CD.yml replaces this line with your username and the VERSION tag
          imagePullPolicy: Always
          ports:
            - containerPort: 5000                               # Flask port in app.py
          # Kubernetes only sends traffic to a pod once this check passes
          readinessProbe:
            httpGet:
              path: /                                           # the form page, returns 200 when the app is up
              port: 5000
            initialDelaySeconds: 10      # the app loads the Random Forest model on start-up
            periodSeconds: 5
            failureThreshold: 6
          # Kubernetes restarts the container if this check keeps failing
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi              # scikit-learn models need more memory than a plain Flask app
