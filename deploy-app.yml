# deploy-app.yml
# First deployment of the app (v1) to minikube, using the same deployment.yaml
# and service.yaml that CD.yml uses. After this, CD.yml handles every update.
#
#   ansible-playbook -i inventory.ini deploy-app.yml -e dockerhub_user=<YOUR_DOCKERHUB_USERNAME>
#
# The v1 image must already be on DockerHub (push it with CI first, or by hand).

- name: Deploy the weather app to Kubernetes
  hosts: production
  become: true
  become_user: ubuntu
  vars:
    image_tag: v1
    deploy_dir: /home/ubuntu/k8s

  tasks:
    - name: Make sure dockerhub_user was given
      ansible.builtin.assert:
        that: dockerhub_user is defined
        fail_msg: "Run with -e dockerhub_user=<YOUR_DOCKERHUB_USERNAME>"

    - name: Create a folder for the Kubernetes files
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copy deployment.yaml and service.yaml to the server
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ deploy_dir }}/{{ item }}"
        mode: "0644"
      loop: [deployment.yaml, service.yaml]

    - name: Set the image name and version in deployment.yaml
      ansible.builtin.replace:
        path: "{{ deploy_dir }}/deployment.yaml"
        regexp: 'image: .*'
        replace: "image: {{ dockerhub_user }}/weather-app:{{ image_tag }}"

    - name: Apply the Service and Deployment
      ansible.builtin.command: "kubectl apply -f {{ deploy_dir }}/{{ item }}"
      loop: [service.yaml, deployment.yaml]
      register: applied
      changed_when: "'unchanged' not in applied.stdout"

    - name: Wait for the rollout to finish
      ansible.builtin.command: kubectl rollout status deployment/weather-app --timeout=300s
      changed_when: false

    - name: Check the app answers on the NodePort
      ansible.builtin.shell: curl --fail --silent --retry 5 --retry-delay 3 "http://$(minikube ip):30007"
      register: page
      changed_when: false

    - name: Show the start of the home page
      ansible.builtin.debug:
        msg: "{{ page.stdout_lines[:10] }}"
