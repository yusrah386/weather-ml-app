# inventory.ini - tells Ansible which server to configure and how to log in.
# >>> CHANGE ME <<< put your EC2 instance's current public IP below.
# AWS Academy: download the key from "AWS Details" -> "Download PEM" (labsuser.pem),
# then run:  chmod 400 ~/.ssh/labsuser.pem

[production]
prod-server ansible_host=<PRODUCTION_SERVER_PUBLIC_IP>

[production:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/labsuser.pem
ansible_python_interpreter=/usr/bin/python3
# Don't stop to ask "are you sure you want to connect?" on first SSH
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
