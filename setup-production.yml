# setup-production.yml
# Prepares the AWS Production Server for the pipeline:
#   1. Installs Docker (minikube runs Kubernetes inside a Docker container)
#   2. Installs kubectl (the command-line tool for Kubernetes)
#   3. Installs minikube (a single-node Kubernetes cluster)
#   4. Starts minikube and checks the cluster is ready
#
# Run from your own machine (the Ansible control node):
#   ansible-playbook -i inventory.ini setup-production.yml
#
# Needs an Ubuntu EC2 instance with at least 2 vCPUs and 4 GB RAM (e.g. t3.medium).
# minikube refuses to start on t2.micro / t3.micro.

- name: Set up the Production Server with Docker, kubectl and minikube
  hosts: production
  become: true                     # run tasks with sudo
  vars:
    app_user: ubuntu               # the user that runs minikube and the GitHub runner
    minikube_cpus: 2
    minikube_memory: 3000          # MB

  tasks:
    # ---------- 1. Docker ----------
    - name: Update apt cache and install base packages
      ansible.builtin.apt:
        name: [docker.io, curl, git, conntrack, ca-certificates]
        state: present
        update_cache: true

    - name: Make sure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the ubuntu user run docker without sudo (minikube needs this)
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Reconnect so the new docker group membership takes effect
      ansible.builtin.meta: reset_connection

    # ---------- 2. kubectl ----------
    - name: Find the latest stable kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_version

    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    # ---------- 3. minikube ----------
    - name: Install minikube
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"

    - name: Check installed versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - kubectl version --client
        - minikube version
      register: versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"

    # ---------- 4. Start minikube ----------
    # minikube must NOT run as root with the docker driver, so these run as ubuntu.
    - name: Check whether minikube is already running
      ansible.builtin.command: minikube status
      become_user: "{{ app_user }}"
      register: minikube_status
      failed_when: false
      changed_when: false

    - name: Start minikube with the docker driver
      ansible.builtin.command: >
        minikube start --driver=docker
        --cpus={{ minikube_cpus }} --memory={{ minikube_memory }}
      become_user: "{{ app_user }}"
      when: minikube_status.rc != 0

    - name: Wait until the Kubernetes node is Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=180s
      become_user: "{{ app_user }}"
      changed_when: false

    - name: Show the cluster
      ansible.builtin.command: kubectl get nodes -o wide
      become_user: "{{ app_user }}"
      register: nodes
      changed_when: false

    - name: Print cluster nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
